# Mises à jour des dépendances, proposées en PR vers develop. Les correctifs de
# sécurité (alertes Dependabot) arrivent sans délai ; les montées de version
# ci-dessous attendent `cooldown` : une version piégée est en général retirée
# dans les jours qui suivent sa publication.
version: 2

updates:
  # requirements.txt, requirements-dev.txt et requirements-ci.txt.
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: CHORE
      include: scope
    groups:
      python:
        update-types: [minor, patch]

  # SHA épinglés dans .github/workflows (et le commentaire `# vX.Y.Z` qui suit).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: CHORE
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  # Digest de python:3.14-slim dans le Dockerfile. Passer à 3.15 se décide à la
  # main, avec la CI : seules les reconstructions de 3.14-slim sont proposées.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: CHORE
      include: scope
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
