{% extends "admin/base.html" %}
{% from "admin/_champs.html" import champs %}
{% block titre %}Profil{% endblock %}
{% block contenu %}
  <h1>Profil</h1>
  {% if erreurs %}<p class="message alerte" role="alert">Le formulaire contient des erreurs : rien n'a été enregistré.</p>{% endif %}
  <form method="post" action="/admin/profil">
    {{ champs(liste, valeurs, erreurs) }}
    <div class="actions"><button type="submit">Enregistrer</button></div>
  </form>
{% endblock %}
